apply plugin: "com.android.library"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.columnar"
  compileSdk getExtOrDefault("compileSdkVersion", 34)

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 24)

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  buildFeatures {
    prefab true
    prefabPublishing true
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  prefab {
    "react-native-columnar" {
      headers "../cpp"
      headerOnly true
    }
  }
}

dependencies {
  compileOnly "com.facebook.react:react-android"
}
